<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小组作业 - 模块导航</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
    .wrap { max-width: 900px; margin: 0 auto; padding: 48px 20px; }
    header { text-align: center; margin-bottom: 36px; }
    header h1 { font-size: 30px; margin-bottom: 8px; }
    header p { color: var(--text-light); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .mod { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
           padding: 24px; transition: transform .2s; }
    .mod:hover { transform: translateY(-4px); }
    .mod h2 { font-size: 18px; margin-bottom: 6px; }
    .mod p { font-size: 14px; color: var(--text-light); margin-bottom: 14px; }
    .mod .owner { font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>小组网页作业 · 模块导航</h1>
      <p>第 X 组 ｜ 4 人协作 ｜ 每人负责一个独立模块</p>
    </header>

    <div class="grid">
      <div class="mod">
        <h2>用户登录</h2>
        <p>账号密码校验、记住我、登录状态保存</p>
        <a class="btn btn-secondary" href="modules/login/index.html">进入模块</a>
        <p class="owner">负责人：成员A ｜ 分支 feature/login</p>
      </div>
      <div class="mod">
        <h2>用户注册</h2>
        <p>表单校验、密码强度、两次密码一致性</p>
        <a class="btn btn-secondary" href="modules/register/index.html">进入模块</a>
        <p class="owner">负责人：成员B ｜ 分支 feature/register</p>
      </div>
      <div class="mod">
        <h2>首页 / 商品列表</h2>
        <p>卡片展示、关键字搜索、加入购物车</p>
        <a class="btn btn-secondary" href="modules/home/index.html">进入模块</a>
        <p class="owner">负责人：成员C ｜ 分支 feature/home</p>
      </div>
      <div class="mod">
        <h2>个人中心</h2>
        <p>资料展示与编辑、本地保存、退出登录</p>
        <a class="btn btn-secondary" href="modules/profile/index.html">进入模块</a>
        <p class="owner">负责人：成员D ｜ 分支 feature/profile</p>
      </div>
    </div>
  </div>
</body>
</html>
