<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录</title>
  <link rel="stylesheet" href="../../assets/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box card">
    <h1 class="title">欢迎登录</h1>
    <p class="subtitle">请输入您的账号和密码</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password">
      </div>

      <div class="remember">
        <label><input type="checkbox" id="remember"> 记住我</label>
        <a href="../register/index.html">还没有账号？去注册</a>
      </div>

      <button type="submit" class="btn">登 录</button>
      <p class="tip" id="tip"></p>
    </form>

    <p class="back"><a href="../../index.html">← 返回导航</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
